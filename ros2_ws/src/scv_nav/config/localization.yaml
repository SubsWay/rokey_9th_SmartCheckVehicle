# turtlebot4_navigation (jazzy) config/localization.yaml 원본 사본. PLAN 2-2 AMCL 튜닝은 이 파일을 고친다
# 실행 (저장소 루트에서, robot3 예시):
#   ros2 launch turtlebot4_navigation localization.launch.py namespace:=/robot3 map:=ros2_ws/src/scv_nav/maps/testbed_v1.yaml params:=ros2_ws/src/scv_nav/config/localization.yaml
#   ros2 launch turtlebot4_navigation nav2.launch.py namespace:=/robot3 params_file:=ros2_ws/src/scv_nav/config/nav2.yaml

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 120                  # 원본 60, PLAN 2-2 튜닝 ② 채택 (2026-10-11)
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1               # 원본 0.2, PLAN 2-2 튜닝 ① (2026-10-11)
    update_min_d: 0.10              # 원본 0.25, PLAN 2-2 튜닝 ① (0.2 m/s 저속이라 갱신이 너무 드묾)
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true
