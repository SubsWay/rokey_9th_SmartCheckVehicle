# nav2.yaml 과 같고 controller_server 의 FollowPath 만 RPP (PLAN 3-2 MPPI vs RPP 비교용). 값은 Nav2 문서 기본값, 속도만 0.2
# 비교 대상(MPPI·RPP) 선정 이유와 속도 0.2 m/s 로 맞춘 이유는 docs/driving/PLAN.md 「3-2 비교 대상 선정」 참고
# 실행 (저장소 루트에서, robot3 예시):
#   ros2 launch turtlebot4_navigation localization.launch.py namespace:=/robot3 map:=ros2_ws/src/scv_nav/maps/testbed_v1.yaml params:=ros2_ws/src/scv_nav/config/localization.yaml
#   ros2 launch turtlebot4_navigation nav2.launch.py namespace:=/robot3 params_file:=ros2_ws/src/scv_nav/config/nav2_rpp.yaml

bt_navigator:
  ros__parameters:
    enable_stamped_cmd_vel: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 5000    # 10/15 통합 브랜치: 1000 → 5000 ms. behavior_server 액션(wait·spin)을 1 s 안에 못 찾아 BT 로드 실패 · bringup 중단 (robot3)
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    default_nav_to_pose_bt_xml: $(find-pkg-share scv_nav)/config/navigate_to_pose_scv.xml   # 기본 BT 에서 BackUp 만 뺌 (10/13)
    default_nav_through_poses_bt_xml: $(find-pkg-share scv_nav)/config/navigate_through_poses_scv.xml   # waypoint 지움 거리 0.7 → 0.35 (2026-10-12)
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::PoseProgressChecker"   # 원본 Simple, 제자리 회전도 진척으로 인정 (2026-10-12)
      required_movement_radius: 0.15   # 원본 0.5, 0.2 m/s 저속·짧은 이동에서 "Failed to make progress" 반복 (2026-10-11)
      required_movement_angle: 0.5     # 기본값, 약 29° 돌면 진척 (2026-10-12)
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05          # 원본 0.25, 일반 지점 (10/12 3-4 시험: 0.10 이면 매번 7~9 cm 앞에서 멈춤). 정밀 지점은 mission_executor 가 0.03 / 0.052 로 바꿈
      yaw_goal_tolerance: 0.087
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.2              # PLAN 0-3 측정 속도
      lookahead_dist: 0.4               # 원본 0.6, 코너 질러가기 줄이기 시험 (2026-10-12)
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      rotate_to_heading_angular_vel: 0.5   # 원본 1.0, 도착 회전 오버슈트 줄이기 시험 (2026-10-12)
      transform_tolerance: 0.1
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 3.2
      allow_reversing: false
      max_robot_pose_search_dist: 1.0   # 원본 10.0: 갔다 돌아오는 경로에서 뒤 구간을 "지금 위치"로 잡아 waypoint 를 건너뜀 (2026-10-12 4-2)

local_costmap:
  local_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.06
      footprint: "[[ 0.189,  0.000],
                  [ 0.134, -0.134],
                  [ 0.000, -0.189],
                  [-0.134, -0.134],
                  [-0.189,  0.000],
                  [-0.134,  0.134],
                  [ 0.000,  0.189],
                  [ 0.134,  0.134]]"
      use_maximum: true                  # StaticLayer 가 읽는 costmap 단위 값 (플러그인 안에 두면 무시됨). false 면 keepout 마스크의 빈 칸이 지도 벽을 덮어 지움 (2026-10-12)
      plugins: ["static_layer", "voxel_layer", "keepout_layer", "inflation_layer"]
      keepout_layer:                     # PLAN 4-1 · IF-10 RSSI 음영 마스크. 점유(100) 칸 = 통과 불가
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true                    # 마스크(keepout_mask) 발행자가 없으면 costmap 이 준비 안 됨 → 경로 계획 실패. 관제가 시작부터 빈 마스크를 냄 (interfaces v0.2.8)
        map_topic: $(var namespace)/keepout_mask   # 그냥 keepout_mask 면 {ns}/global_costmap/keepout_mask 로 붙음 (IF-10 은 {ns}/keepout_mask)
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 10.0        # 원본 4.0. 측정 줄이 벽 inflation 에 걸려 경로가 줄에서 0.3 m 휘어 나감 (2026-10-13)
        inflation_radius: 0.30           # 원본 0.45. 관제 경로 점의 벽 여유(obstacle_clearance_m 0.30)와 같게
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: -0.1                   # 원본 0.0: 라이다 높이가 odom 에서 −0.00… 으로 잡혀 "Sensor origin out of map bounds", raytrace 안 됨 (2026-10-12)
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      enable_stamped_cmd_vel: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[ 0.189,  0.000],
                  [ 0.134, -0.134],
                  [ 0.000, -0.189],
                  [-0.134, -0.134],
                  [-0.189,  0.000],
                  [-0.134,  0.134],
                  [ 0.000,  0.189],
                  [ 0.134,  0.134]]"
      resolution: 0.06
      track_unknown_space: true
      use_maximum: true                  # StaticLayer 가 읽는 costmap 단위 값 (플러그인 안에 두면 무시됨). false 면 keepout 마스크의 빈 칸이 지도 벽을 덮어 지움 (2026-10-12)
      plugins: ["static_layer", "obstacle_layer", "keepout_layer", "inflation_layer"]
      keepout_layer:                     # PLAN 4-1 · IF-10 RSSI 음영 마스크. 점유(100) 칸 = 통과 불가
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true                    # 마스크(keepout_mask) 발행자가 없으면 costmap 이 준비 안 됨 → 경로 계획 실패. 관제가 시작부터 빈 마스크를 냄 (interfaces v0.2.8)
        map_topic: $(var namespace)/keepout_mask   # 그냥 keepout_mask 면 {ns}/global_costmap/keepout_mask 로 붙음 (IF-10 은 {ns}/keepout_mask)
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0         # 10/13 10.0 → 10/15 5.0 (통합 브랜치): 플래너가 상자 옆 몇 cm 로 붙어 지나가다 닿음 (실기 4회차). 전역만, local 은 그대로
        inflation_radius: 0.40           # 10/13 0.30 → 10/15 0.40 (통합 브랜치). 벽 옆 측정 줄이 조금 휠 수 있음
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    #expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    global_frame: map
    local_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    enable_stamped_cmd_vel: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    enable_stamped_cmd_vel: true
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 1.0]    # 원본 0.26, PLAN 0-3 측정 속도
    min_velocity: [0.0, 0.0, -1.0]   # 후진 금지 (원본 -0.2, interfaces 「자세 보정 "뒤로"」 10/13)
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    enable_stamped_cmd_vel: true
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel"
    state_topic: "collision_monitor_state"
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: True
    stop_pub_timeout: 2.0
    # Polygons represent zone around the robot for "stop", "slowdown" and "limit" action types,
    # and robot footprint for "approach" action type.
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      footprint_topic: "local_costmap/published_footprint"
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 6
      visualize: False
      enabled: True
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "scan"
      min_height: 0.15
      max_height: 2.0
      enabled: True

docking_server:
  ros__parameters:
    enable_stamped_cmd_vel: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5

    # Types of docks
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false # true
      use_stall_detection: false # true

      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1

    # Dock instances
    # The following example illustrates configuring dock instances.
    # docks: ['home_dock']  # Input your docks here
    # home_dock:
    #   type: 'simple_charging_dock'
    #   frame: map
    #   pose: [0.0, 0.0, 0.0]

    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
